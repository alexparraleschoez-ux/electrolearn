<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - ElectroLearn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'heading': ['Poppins', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'electro-dark': '#0A1628',
                        'electro-blue': '#1E3A8A',
                        'electro-circuit': '#1E40AF',
                        'electro-yellow': '#FACC15',
                        'electro-cyan': '#00D4FF',
                        'electro-green': '#00FF88',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        .slide-up { animation: slideUp 0.6s ease-out; }
        
        body {
            background: linear-gradient(135deg, #0A1628 0%, #1E3A8A 100%);
            min-height: 100vh;
        }

        /* Contenedor responsive para YouTube Shorts */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            border-radius: 1rem;
            overflow: hidden;
        }

        /* Aspect ratio 9:16 para Shorts */
        .video-wrapper {
            position: relative;
            padding-bottom: 177.77%; /* 9:16 aspect ratio */
            height: 0;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Ajustes para móviles */
        @media (max-width: 640px) {
            .video-container {
                max-width: 100%;
                margin: 0 -1.5rem;
                border-radius: 0;
            }
            
            .video-wrapper {
                padding-bottom: 177.77%;
                max-height: 70vh;
            }
        }

        /* Ajustes para tablets */
        @media (min-width: 641px) and (max-width: 1024px) {
            .video-wrapper {
                max-height: 65vh;
            }
        }

        /* Ajustes para desktop */
        @media (min-width: 1025px) {
            .video-wrapper {
                max-height: 75vh;
            }
        }

        /* Glow effect */
        .glow-border {
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3),
                        inset 0 0 20px rgba(0, 212, 255, 0.1);
        }
    </style>
</head>
<body class="text-white font-body min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal -->
    <div class="max-w-4xl w-full text-center">
        
        <!-- Logo y Título -->
        <div class="mb-6 md:mb-8 slide-up">
            <img src="multimedia/imagenes/logo.png" alt="ElectroLearn" class="h-20 md:h-24 mx-auto mb-4 drop-shadow-[0_0_20px_rgba(0,212,255,0.5)]" onerror="this.style.display='none'">
            <h1 class="text-3xl md:text-5xl font-heading font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-electro-cyan to-electro-yellow mb-2">
                ¡Bienvenido a ElectroLearn!
            </h1>
            <p id="welcome-message" class="text-base md:text-xl text-slate-300 px-2"></p>
        </div>

        <!-- Video Container -->
        <div class="bg-electro-dark/50 backdrop-blur-lg rounded-3xl p-4 md:p-8 border-2 border-electro-cyan/30 shadow-2xl slide-up" style="animation-delay: 0.2s">
            
            <!-- Video de YouTube Shorts -->
            <div class="video-container glow-border border-4 border-electro-cyan/50">
                <div class="video-wrapper">
                    <iframe 
                        id="welcome-video"
                        src="https://www.youtube.com/embed/lgIGX4bClNk?enablejsapi=1&autoplay=1&mute=1&rel=0&controls=1&loop=0&playlist=lgIGX4bClNk" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <!-- Mensaje de redirección -->
            <div id="redirecting" class="mt-6 slide-up" style="animation-delay: 0.4s">
                <div class="inline-flex items-center gap-3 bg-electro-green/20 border border-electro-green/50 px-4 md:px-6 py-2 md:py-3 rounded-full">
                    <i class="fas fa-info-circle text-electro-green text-lg md:text-xl"></i>
                    <span class="text-electro-green font-bold text-sm md:text-base">Después del video serás redirigido automáticamente...</span>
                </div>
            </div>

            <!-- Botón de saltar -->
            <button onclick="skipVideo()" class="mt-6 bg-electro-yellow hover:bg-yellow-400 text-electro-dark font-bold py-2.5 md:py-3 px-6 md:px-8 rounded-full transition-all transform hover:scale-105 text-sm md:text-base">
                <i class="fas fa-forward mr-2"></i>Saltar video e ir al inicio
            </button>
        </div>

    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <script>
        // Verificar si hay sesión
        const usuario = localStorage.getItem('electrolearn_user');
        if (!usuario) {
            window.location.href = 'login.html';
        }

        // Mostrar nombre del usuario
        document.getElementById('welcome-message').textContent = `Hola, ${usuario}. Prepárate para aprender electricidad y electrónica.`;

        let player;
        let videoEnded = false;
        let redirectTimeout;

        // Función para crear el reproductor de YouTube
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('welcome-video', {
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // Cuando el reproductor está listo
        function onPlayerReady(event) {
            // Intentar reproducir sin sonido primero (los navegadores bloquean autoplay con sonido)
            event.target.playVideo();
            
            // Programar redirección por seguridad (70 segundos)
            redirectTimeout = setTimeout(() => {
                if (!videoEnded) {
                    skipVideo();
                }
            }, 70000);
        }

        // Detectar cambios de estado del video
        function onPlayerStateChange(event) {
            // Si el video terminó (YT.PlayerState.ENDED = 0)
            if (event.data === 0) {
                videoEnded = true;
                clearTimeout(redirectTimeout);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
            // Si el video está reproduciéndose (YT.PlayerState.PLAYING = 1)
            else if (event.data === 1) {
                // Desmutear después de que empiece a reproducir (algunos navegadores lo permiten)
                try {
                    event.target.unMute();
                } catch(e) {
                    // Si no se puede, permanece muteado
                }
            }
        }

        // Función para saltar video
        function skipVideo() {
            videoEnded = true;
            clearTimeout(redirectTimeout);
            if (player && player.stopVideo) {
                player.stopVideo();
            }
            window.location.href = 'index.html';
        }

        // Fallback: Si la API de YouTube no carga, usar timeout
        setTimeout(() => {
            if (!player && !videoEnded) {
                redirectTimeout = setTimeout(() => {
                    skipVideo();
                }, 65000);
            }
        }, 2000);

        // Prevenir que el usuario se vaya sin confirmar (opcional)
        window.addEventListener('beforeunload', function (e) {
            if (!videoEnded) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
