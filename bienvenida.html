<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - ElectroLearn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'heading': ['Poppins', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'electro-dark': '#0A1628',
                        'electro-blue': '#1E3A8A',
                        'electro-circuit': '#1E40AF',
                        'electro-yellow': '#FACC15',
                        'electro-cyan': '#00D4FF',
                        'electro-green': '#00FF88',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        .slide-up { animation: slideUp 0.6s ease-out; }
        
        body {
            background: linear-gradient(135deg, #0A1628 0%, #1E3A8A 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Contenedor responsive para YouTube */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            border-radius: 1rem;
            overflow: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .video-container.hidden-video {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Aspect ratio 9:16 para Shorts */
        .video-wrapper {
            position: relative;
            padding-bottom: 177.77%;
            height: 0;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .video-container {
                max-width: 100%;
                margin: 0 -1rem;
                border-radius: 0;
            }
            .video-wrapper {
                max-height: 75vh;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .video-wrapper {
                max-height: 70vh;
            }
        }

        @media (min-width: 1025px) {
            .video-wrapper {
                max-height: 80vh;
            }
        }

        .glow-border {
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3),
                        inset 0 0 20px rgba(0, 212, 255, 0.1);
        }
    </style>
</head>
<body class="text-white font-body min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal -->
    <div class="max-w-4xl w-full text-center">
        
        <!-- Logo y Título -->
        <div class="mb-6 md:mb-8 slide-up">
            <img src="multimedia/imagenes/logo.png" alt="ElectroLearn" class="h-20 md:h-24 mx-auto mb-4 drop-shadow-[0_0_20px_rgba(0,212,255,0.5)]" onerror="this.style.display='none'">
            <h1 class="text-3xl md:text-5xl font-heading font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-electro-cyan to-electro-yellow mb-2">
                ¡Bienvenido a ElectroLearn!
            </h1>
            <p id="welcome-message" class="text-base md:text-xl text-slate-300 px-2"></p>
        </div>

        <!-- Video Container -->
        <div id="video-section" class="bg-electro-dark/50 backdrop-blur-lg rounded-3xl p-4 md:p-8 border-2 border-electro-cyan/30 shadow-2xl slide-up" style="animation-delay: 0.2s">
            
            <!-- Video de YouTube -->
            <div id="video-container" class="video-container glow-border border-4 border-electro-cyan/50">
                <div class="video-wrapper">
                    <div id="youtube-player"></div>
                </div>
            </div>

            <!-- Mensaje de redirección -->
            <div id="redirect-message" class="mt-6 slide-up" style="animation-delay: 0.4s">
                <div class="inline-flex items-center gap-3 bg-electro-green/20 border border-electro-green/50 px-4 md:px-6 py-2 md:py-3 rounded-full">
                    <i class="fas fa-info-circle text-electro-green text-lg md:text-xl"></i>
                    <span class="text-electro-green font-bold text-sm md:text-base">Después del video serás redirigido automáticamente...</span>
                </div>
            </div>

            <!-- Botón de saltar -->
            <button onclick="manualSkip()" class="mt-6 bg-electro-yellow hover:bg-yellow-400 text-electro-dark font-bold py-2.5 md:py-3 px-6 md:px-8 rounded-full transition-all transform hover:scale-105 text-sm md:text-base">
                <i class="fas fa-forward mr-2"></i>Saltar video e ir al inicio
            </button>
        </div>

    </div>

    <script>
        // Verificar sesión
        const usuario = localStorage.getItem('electrolearn_user');
        if (!usuario) {
            window.location.href = 'login.html';
        }

        document.getElementById('welcome-message').textContent = `Hola, ${usuario}. Prepárate para aprender electricidad y electrónica.`;

        // Variables de control
        let player = null;
        let hasRedirected = false;
        let redirectTimer = null;
        let videoDuration = 131000; // 2:11 en milisegundos
        let videoStartTime = null;

        // Función única de redirección
        function performRedirect() {
            if (hasRedirected) return;
            hasRedirected = true;

            // Limpiar todo
            if (redirectTimer) {
                clearTimeout(redirectTimer);
                redirectTimer = null;
            }

            // Ocultar video inmediatamente
            const container = document.getElementById('video-container');
            if (container) {
                container.classList.add('hidden-video');
            }

            // Detener reproductor
            if (player && typeof player.stopVideo === 'function') {
                try {
                    player.stopVideo();
                    player.destroy();
                } catch(e) {}
            }

            // Redirigir
            setTimeout(() => {
                window.location.replace('index.html');
            }, 50);
        }

        // Saltar manualmente
        function manualSkip() {
            performRedirect();
        }

        // Cargar API de YouTube
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Cuando la API esté lista
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: 'lgIGX4bClNk',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 1,
                    'rel': 0,
                    'loop': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // Cuando el reproductor esté listo
        function onPlayerReady(event) {
            videoStartTime = Date.now();
            
            // Reproducir
            try {
                event.target.playVideo();
            } catch(e) {}

            // Timeout de seguridad basado en la duración real del video
            redirectTimer = setTimeout(() => {
                if (!hasRedirected) {
                    performRedirect();
                }
            }, videoDuration + 5000); // 5 segundos de margen
        }

        // Cambios de estado
        function onPlayerStateChange(event) {
            // Video terminado (0)
            if (event.data === 0) {
                if (!hasRedirected) {
                    performRedirect();
                }
            }
            // Video reproduciéndose (1)
            else if (event.data === 1) {
                // Intentar desmutear después de 1 segundo
                setTimeout(() => {
                    if (player && !hasRedirected) {
                        try {
                            player.unMute();
                        } catch(e) {}
                    }
                }, 1000);
            }
            // Video en pausa (2) o buffer (3)
            else if (event.data === 2 || event.data === 3) {
                // Verificar si ya pasó el tiempo máximo
                if (videoStartTime && !hasRedirected) {
                    const elapsed = Date.now() - videoStartTime;
                    if (elapsed > videoDuration + 5000) {
                        performRedirect();
                    }
                }
            }
        }

        // Prevenir navegación accidental
        window.addEventListener('beforeunload', function(e) {
            if (!hasRedirected) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // Cleanup al salir
        window.addEventListener('unload', function() {
            if (player) {
                try {
                    player.destroy();
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
