<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - ElectroLearn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'heading': ['Poppins', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'electro-dark': '#0A1628',
                        'electro-blue': '#1E3A8A',
                        'electro-circuit': '#1E40AF',
                        'electro-yellow': '#FACC15',
                        'electro-cyan': '#00D4FF',
                        'electro-green': '#00FF88',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        .slide-up { animation: slideUp 0.6s ease-out; }
        
        body {
            background: linear-gradient(135deg, #0A1628 0%, #1E3A8A 100%);
        }
    </style>
</head>
<body class="text-white font-body min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal -->
    <div class="max-w-4xl w-full text-center">
        
        <!-- Logo y Título -->
        <div class="mb-8 slide-up">
            <img src="multimedia/imagenes/logo.png" alt="ElectroLearn" class="h-24 mx-auto mb-4 drop-shadow-[0_0_20px_rgba(0,212,255,0.5)]" onerror="this.style.display='none'">
            <h1 class="text-5xl font-heading font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-electro-cyan to-electro-yellow mb-2">
                ¡Bienvenido a ElectroLearn!
            </h1>
            <p id="welcome-message" class="text-xl text-slate-300"></p>
        </div>

        <!-- Video Container -->
        <div class="bg-electro-dark/50 backdrop-blur-lg rounded-3xl p-8 border-2 border-electro-cyan/30 shadow-2xl slide-up" style="animation-delay: 0.2s">
            
            <!-- Video -->
            <div class="relative rounded-2xl overflow-hidden border-4 border-electro-cyan/50 shadow-[0_0_40px_rgba(0,212,255,0.3)]">
                <!-- Reemplaza 'video-bienvenida.mp4' con la ruta de tu video -->
                <video id="welcome-video" class="w-full" autoplay playsinline controls>
                    <source src="multimedia/videos/bienvenida.mp4" type="video/mp4">
                    <!-- Si no tienes video aún, puedes usar un placeholder o eliminar esta línea -->
                    Tu navegador no soporta el elemento de video.
                </video>
                
                <!-- Overlay de carga -->
                <div id="video-loading" class="absolute inset-0 bg-electro-dark/80 flex items-center justify-center">
                    <div class="text-center">
                        <i class="fas fa-circle-notch fa-spin text-5xl text-electro-cyan mb-4"></i>
                        <p class="text-electro-cyan">Cargando video...</p>
                    </div>
                </div>
            </div>

            <!-- Barra de progreso del video -->
            <div class="mt-6 bg-slate-700 rounded-full h-2 overflow-hidden">
                <div id="video-progress" class="bg-gradient-to-r from-electro-cyan to-electro-green h-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p class="text-sm text-slate-400 mt-2">Redirigiendo automáticamente...</p>

            <!-- Botón de saltar (opcional) -->
            <button onclick="skipVideo()" class="mt-6 bg-electro-yellow hover:bg-yellow-400 text-electro-dark font-bold py-3 px-8 rounded-full transition-all transform hover:scale-105">
                <i class="fas fa-forward mr-2"></i>Saltar video e ir al inicio
            </button>
        </div>

        <!-- Mensaje de redirección -->
        <div id="redirecting" class="hidden mt-6 slide-up">
            <div class="inline-flex items-center gap-3 bg-electro-green/20 border border-electro-green/50 px-6 py-3 rounded-full">
                <i class="fas fa-check-circle text-electro-green text-2xl"></i>
                <span class="text-electro-green font-bold">¡Video completado! Redirigiendo...</span>
            </div>
        </div>

    </div>

    <script>
        // Verificar si hay sesión
        const usuario = localStorage.getItem('electrolearn_user');
        if (!usuario) {
            window.location.href = 'login.html';
        }

        // Mostrar nombre del usuario
        document.getElementById('welcome-message').textContent = `Hola, ${usuario}. Prepárate para aprender electricidad y electrónica.`;

        // Variables del video
        const video = document.getElementById('welcome-video');
        const loading = document.getElementById('video-loading');
        const progress = document.getElementById('video-progress');
        const redirecting = document.getElementById('redirecting');

        // Cuando el video está listo
        video.addEventListener('loadeddata', () => {
            loading.style.display = 'none';
            video.play().catch(error => {
                console.log('Autoplay prevenido por el navegador:', error);
                // Mostrar mensaje si el autoplay está bloqueado
                loading.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-play-circle text-5xl text-electro-cyan mb-4"></i>
                        <p class="text-electro-cyan mb-4">Haz clic para reproducir el video</p>
                        <button onclick="video.play(); this.parentElement.parentElement.style.display='none'" 
                                class="bg-electro-cyan text-electro-dark font-bold py-3 px-6 rounded-full">
                            <i class="fas fa-play mr-2"></i>Reproducir
                        </button>
                    </div>
                `;
            });
        });

        // Actualizar barra de progreso
        video.addEventListener('timeupdate', () => {
            const percent = (video.currentTime / video.duration) * 100;
            progress.style.width = percent + '%';
        });

        // Cuando el video termina
        video.addEventListener('ended', () => {
            mostrarRedireccion();
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        });

        // Función para saltar video
        function skipVideo() {
            video.pause();
            mostrarRedireccion();
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }

        // Mostrar mensaje de redirección
        function mostrarRedireccion() {
            redirecting.classList.remove('hidden');
            progress.classList.remove('from-electro-cyan', 'to-electro-green');
            progress.classList.add('bg-electro-green');
            progress.style.width = '100%';
        }

        // Si hay error al cargar el video
        video.addEventListener('error', () => {
            loading.innerHTML = `
                <div class="text-center">
                    <i class="fas fa-exclamation-triangle text-5xl text-electro-yellow mb-4"></i>
                    <p class="text-electro-yellow mb-4">No se pudo cargar el video</p>
                    <button onclick="skipVideo()" 
                            class="bg-electro-yellow text-electro-dark font-bold py-3 px-6 rounded-full">
                        Continuar de todas formas
                    </button>
                </div>
            `;
        });
    </script>
</body>
</html>
