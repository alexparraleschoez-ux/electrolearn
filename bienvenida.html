<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - ElectroLearn</title>
        <!-- FAVICON -->
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'heading': ['Poppins', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'electro-dark': '#0A1628',
                        'electro-blue': '#1E3A8A',
                        'electro-circuit': '#1E40AF',
                        'electro-yellow': '#FACC15',
                        'electro-cyan': '#00D4FF',
                        'electro-green': '#00FF88',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        .slide-up { animation: slideUp 0.6s ease-out; }
        
        body {
            background: linear-gradient(135deg, #0A1628 0%, #1E3A8A 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Contenedor del video con transición suave */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            border-radius: 1rem;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Estado oculto del video */
        .video-container.ended {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transform: scale(0.95);
        }

        /* Wrapper con aspect ratio 9:16 */
        .video-wrapper {
            position: relative;
            padding-bottom: 177.77%;
            height: 0;
            overflow: hidden;
        }

        .video-wrapper iframe,
        .video-wrapper > div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .video-container {
                max-width: 100%;
                margin: 0 -1rem;
                border-radius: 0;
            }
            .video-wrapper {
                max-height: 75vh;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .video-wrapper {
                max-height: 70vh;
            }
        }

        @media (min-width: 1025px) {
            .video-wrapper {
                max-height: 80vh;
            }
        }

        .glow-border {
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3),
                        inset 0 0 20px rgba(0, 212, 255, 0.1);
        }

        /* Overlay para prevenir interacción durante redirección */
        .redirect-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 22, 40, 0.95);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .redirect-overlay.active {
            display: flex;
        }
    </style>
</head>
<body class="text-white font-body min-h-screen flex items-center justify-center p-4">

    <!-- Overlay de redirección -->
    <div id="redirect-overlay" class="redirect-overlay">
        <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-electro-cyan mb-4"></div>
            <p class="text-electro-cyan text-xl font-bold">Redirigiendo...</p>
        </div>
    </div>

    <!-- Contenedor Principal -->
    <div class="max-w-4xl w-full text-center">
        
        <!-- Logo y Título -->
        <div class="mb-6 md:mb-8 slide-up">
            <img src="multimedia/imagenes/logo.png" alt="ElectroLearn" class="h-20 md:h-24 mx-auto mb-4 drop-shadow-[0_0_20px_rgba(0,212,255,0.5)]" onerror="this.style.display='none'">
            <h1 class="text-3xl md:text-5xl font-heading font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-electro-cyan to-electro-yellow mb-2">
                ¡Bienvenido a ElectroLearn!
            </h1>
            <p id="welcome-message" class="text-base md:text-xl text-slate-300 px-2"></p>
        </div>

        <!-- Video Container -->
        <div id="video-section" class="bg-electro-dark/50 backdrop-blur-lg rounded-3xl p-4 md:p-8 border-2 border-electro-cyan/30 shadow-2xl slide-up" style="animation-delay: 0.2s">
            
            <!-- Video de YouTube -->
            <div id="video-container" class="video-container glow-border border-4 border-electro-cyan/50">
                <div class="video-wrapper">
                    <div id="player-container"></div>
                </div>
            </div>

            <!-- Mensaje de redirección -->
            <div id="redirect-message" class="mt-6 slide-up" style="animation-delay: 0.4s">
                <div class="inline-flex items-center gap-3 bg-electro-green/20 border border-electro-green/50 px-4 md:px-6 py-2 md:py-3 rounded-full">
                    <i class="fas fa-info-circle text-electro-green text-lg md:text-xl"></i>
                    <span class="text-electro-green font-bold text-sm md:text-base">Después del video serás redirigido automáticamente...</span>
                </div>
            </div>

            <!-- Botón de saltar -->
            <button onclick="skipToIndex()" class="mt-6 bg-electro-yellow hover:bg-yellow-400 text-electro-dark font-bold py-2.5 md:py-3 px-6 md:px-8 rounded-full transition-all transform hover:scale-105 text-sm md:text-base">
                <i class="fas fa-forward mr-2"></i>Saltar video e ir al inicio
            </button>
        </div>

    </div>

    <script>
        // Verificar sesión
        const usuario = localStorage.getItem('electrolearn_user');
        if (!usuario) {
            window.location.href = 'login.html';
        }

        document.getElementById('welcome-message').textContent = `Hola, ${usuario}. Prepárate para aprender electricidad y electrónica.`;

        // Variables de control
        let player = null;
        let isRedirecting = false;
        let videoEnded = false;
        let safetyTimer = null;
        let checkInterval = null;
        const VIDEO_ID = 'lgIGX4bClNk';
        const VIDEO_DURATION_MS = 131000; // 2:11 en milisegundos

        // Función principal de redirección
        function redirectToIndex() {
            if (isRedirecting) return;
            isRedirecting = true;

            // Limpiar todos los timers e intervals
            if (safetyTimer) {
                clearTimeout(safetyTimer);
                safetyTimer = null;
            }
            if (checkInterval) {
                clearInterval(checkInterval);
                checkInterval = null;
            }

            // Marcar video como terminado
            videoEnded = true;

            // Ocultar video inmediatamente con clase CSS
            const videoContainer = document.getElementById('video-container');
            if (videoContainer) {
                videoContainer.classList.add('ended');
            }

            // Detener y destruir el reproductor
            if (player) {
                try {
                    player.stopVideo();
                    player.pauseVideo();
                    setTimeout(() => {
                        if (player && player.destroy) {
                            player.destroy();
                            player = null;
                        }
                    }, 100);
                } catch(e) {
                    console.log('Error al detener video:', e);
                }
            }

            // Mostrar overlay de redirección
            const overlay = document.getElementById('redirect-overlay');
            if (overlay) {
                overlay.classList.add('active');
            }

            // Redirigir después de un breve delay para que se vea la transición
            setTimeout(() => {
                window.location.replace('index.html');
            }, 300);
        }

        // Función para saltar manualmente
        function skipToIndex() {
            redirectToIndex();
        }

        // Cargar API de YouTube
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Cuando la API esté lista
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-container', {
                videoId: VIDEO_ID,
                width: '100%',
                height: '100%',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 1,
                    'rel': 0,
                    'loop': 0,
                    'disablekb': 0,
                    'fs': 1,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        // Cuando el reproductor esté listo
        function onPlayerReady(event) {
            console.log('Player ready');
            
            // Reproducir el video
            try {
                event.target.playVideo();
            } catch(e) {
                console.log('Error al reproducir:', e);
            }

            // Timer de seguridad: 140 segundos (131 + 9 de margen)
            safetyTimer = setTimeout(() => {
                if (!videoEnded) {
                    console.log('Safety timeout triggered');
                    redirectToIndex();
                }
            }, 140000);

            // Verificación periódica del estado del video
            checkInterval = setInterval(() => {
                if (player && player.getCurrentTime && !videoEnded) {
                    const currentTime = player.getCurrentTime();
                    const duration = player.getDuration();
                    
                    // Si el tiempo actual está muy cerca del final (dentro de 2 segundos)
                    if (duration > 0 && currentTime >= duration - 2) {
                        console.log('Video near end detected');
                        videoEnded = true;
                        redirectToIndex();
                    }
                }
            }, 1000); // Verificar cada segundo
        }

        // Cambios de estado del reproductor
        function onPlayerStateChange(event) {
            console.log('Player state changed:', event.data);

            // ENDED (0) - Video terminó
            if (event.data === YT.PlayerState.ENDED) {
                console.log('Video ended event detected');
                if (!videoEnded) {
                    videoEnded = true;
                    redirectToIndex();
                }
            }
            // PLAYING (1) - Video se está reproduciendo
            else if (event.data === YT.PlayerState.PLAYING) {
                // Intentar desmutear después de 1.5 segundos
                setTimeout(() => {
                    if (player && !videoEnded) {
                        try {
                            player.unMute();
                        } catch(e) {}
                    }
                }, 1500);
            }
            // PAUSED (2) - Video pausado
            else if (event.data === YT.PlayerState.PAUSED) {
                // Si está pausado cerca del final, redirigir
                if (player && !videoEnded) {
                    const currentTime = player.getCurrentTime();
                    const duration = player.getDuration();
                    if (duration > 0 && currentTime >= duration - 3) {
                        videoEnded = true;
                        redirectToIndex();
                    }
                }
            }
            // BUFFERING (3) - Video cargando
            else if (event.data === YT.PlayerState.BUFFERING) {
                // No hacer nada, esperar a que cargue
            }
        }

        // Manejo de errores
        function onPlayerError(event) {
            console.log('Player error:', event.data);
            // Si hay error, redirigir después de 5 segundos
            setTimeout(() => {
                if (!videoEnded) {
                    redirectToIndex();
                }
            }, 5000);
        }

        // Prevenir navegación accidental
        window.addEventListener('beforeunload', function(e) {
            if (!videoEnded && !isRedirecting) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // Limpieza al salir
        window.addEventListener('unload', function() {
            if (player) {
                try {
                    player.destroy();
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
