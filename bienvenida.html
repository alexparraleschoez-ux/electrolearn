<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - ElectroLearn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'heading': ['Poppins', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'electro-dark': '#0A1628',
                        'electro-blue': '#1E3A8A',
                        'electro-circuit': '#1E40AF',
                        'electro-yellow': '#FACC15',
                        'electro-cyan': '#00D4FF',
                        'electro-green': '#00FF88',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        .slide-up { animation: slideUp 0.6s ease-out; }
        
        body {
            background: linear-gradient(135deg, #0A1628 0%, #1E3A8A 100%);
        }
    </style>
</head>
<body class="text-white font-body min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal -->
    <div class="max-w-4xl w-full text-center">
        
        <!-- Logo y Título -->
        <div class="mb-8 slide-up">
            <img src="multimedia/imagenes/logo.png" alt="ElectroLearn" class="h-24 mx-auto mb-4 drop-shadow-[0_0_20px_rgba(0,212,255,0.5)]" onerror="this.style.display='none'">
            <h1 class="text-4xl md:text-5xl font-heading font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-electro-cyan to-electro-yellow mb-2">
                ¡Bienvenido a ElectroLearn!
            </h1>
            <p id="welcome-message" class="text-lg md:text-xl text-slate-300"></p>
        </div>

        <!-- Video Container -->
        <div class="bg-electro-dark/50 backdrop-blur-lg rounded-3xl p-6 md:p-8 border-2 border-electro-cyan/30 shadow-2xl slide-up" style="animation-delay: 0.2s">
            
            <!-- Video de YouTube -->
            <div class="relative rounded-2xl overflow-hidden border-4 border-electro-cyan/50 shadow-[0_0_40px_rgba(0,212,255,0.3)]" style="padding-bottom: 177.77%; height: 0;">
                <!-- YouTube Shorts (formato vertical 9:16) -->
                <iframe 
                    id="welcome-video"
                    class="absolute top-0 left-0 w-full h-full"
                    src="https://www.youtube.com/embed/lgIGX4bClNk?autoplay=1&rel=0&mute=0" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <!-- Mensaje de redirección -->
            <div id="redirecting" class="mt-6 slide-up" style="animation-delay: 0.4s">
                <div class="inline-flex items-center gap-3 bg-electro-green/20 border border-electro-green/50 px-6 py-3 rounded-full">
                    <i class="fas fa-info-circle text-electro-green text-xl"></i>
                    <span class="text-electro-green font-bold">Después del video serás redirigido automáticamente...</span>
                </div>
            </div>

            <!-- Botón de saltar -->
            <button onclick="skipVideo()" class="mt-6 bg-electro-yellow hover:bg-yellow-400 text-electro-dark font-bold py-3 px-8 rounded-full transition-all transform hover:scale-105">
                <i class="fas fa-forward mr-2"></i>Saltar video e ir al inicio
            </button>
        </div>

    </div>

    <script>
        // Verificar si hay sesión
        const usuario = localStorage.getItem('electrolearn_user');
        if (!usuario) {
            window.location.href = 'login.html';
        }

        // Mostrar nombre del usuario
        document.getElementById('welcome-message').textContent = `Hola, ${usuario}. Prepárate para aprender electricidad y electrónica.`;

        // Detectar cuando el video termina (YouTube)
        // Como es un Short, estimamos que dura alrededor de 60 segundos
        // El usuario puede saltar o ver completo
        
        let videoEnded = false;
        const videoIframe = document.getElementById('welcome-video');
        
        // Función para saltar video
        function skipVideo() {
            videoEnded = true;
            window.location.href = 'index.html';
        }

        // Redirección automática después de 65 segundos (tiempo estimado del Short)
        setTimeout(() => {
            if (!videoEnded) {
                skipVideo();
            }
        }, 65000); // 65 segundos

        // También agregar un listener para cuando el video termine realmente
        // Usando postMessage API de YouTube
        window.addEventListener('message', (event) => {
            if (event.origin === 'https://www.youtube.com' && event.data === 'ended') {
                videoEnded = true;
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
        });

        // Fallback: Si pasan 70 segundos, redirigir sí o sí
        setTimeout(() => {
            if (!videoEnded) {
                window.location.href = 'index.html';
            }
        }, 70000);
    </script>
</body>
</html>
